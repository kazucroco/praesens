<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praesens Guest Enrollment</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --text: #1c1b19;
    --muted: #6b6862;
    --border: #e2dfd8;
    --accent: #2f5d50;
    --accent-text: #ffffff;
    --ok: #2e7d4f;
    --ok-bg: #e6f3eb;
    --warn: #8a5a00;
    --warn-bg: #fbf0d9;
    --bad: #b3261e;
    --bad-bg: #fbe9e7;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --surface: #1f1f1d;
      --text: #ecebe8;
      --muted: #a3a09a;
      --border: #34332f;
      --accent: #6fb39c;
      --accent-text: #0f1a16;
      --ok: #7fd1a1;
      --ok-bg: #1d3327;
      --warn: #f0c46b;
      --warn-bg: #3a2f17;
      --bad: #f2a29b;
      --bad-bg: #3d1f1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 2;
  }
  .header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--muted); font-weight: 400; }
  main {
    max-width: 720px; margin: 0 auto; padding: 20px 16px 40px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .panel h2 { font-size: 16px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 9px 10px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  textarea { resize: vertical; min-height: 70px; }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 14px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  button.small { padding: 4px 10px; font-size: 13px; }
  .photo-box {
    aspect-ratio: 4 / 3; width: 100%; border-radius: 8px; overflow: hidden;
    background: var(--bg); border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px;
    position: relative;
  }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; }
  .photo-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .photo-actions button { flex: 1; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .panel-head h2 { margin: 0; }
  .notice { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-top: 12px; }
  .notice.ok { background: var(--ok-bg); color: var(--ok); }
  .notice.warn { background: var(--warn-bg); color: var(--warn); }
  .notice.bad { background: var(--bad-bg); color: var(--bad); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.idle { background: var(--bg); color: var(--muted); }
  .list-head { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .list-head h2 { margin: 0; flex: none; }
  .list-head input { flex: 1; }
  .guests { display: flex; flex-direction: column; gap: 8px; }
  .guest {
    border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px;
  }
  .guest .who { flex: 1; min-width: 0; }
  .guest .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guest .id { color: var(--muted); font-size: 12px; font-weight: 400; }
  .guest .bio { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .guest .status { display: flex; gap: 6px; align-items: center; flex: none; }
  .guest img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--bg); flex: none; }
  @media (max-width: 520px) {
    .guest { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
    .guest img { width: 44px; height: 44px; }
    .guest button.small { padding: 4px 8px; }
    .guest .pill { padding: 3px 8px; font-size: 12px; }
    .guest .who { flex-basis: 100%; }
    .guest .status { flex: 1; }
  }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .hidden { display: none !important; }

  .popups {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 10px; width: min(360px, calc(100vw - 32px));
  }
  .popup {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--ok);
    border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    display: flex; gap: 12px; padding: 12px; animation: popup-in .2s ease-out;
  }
  .popup.review { border-left-color: var(--warn); }
  .popup img { width: 88px; height: 88px; border-radius: 8px; object-fit: cover; background: var(--bg); flex: none; }
  .popup .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .popup .title { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  .popup .name { font-weight: 600; font-size: 16px; }
  .popup .meta { color: var(--muted); font-size: 12px; }
  .popup .bio { font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 7.5em; overflow: auto; }
  .popup .close { border: none; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }
  @keyframes popup-in { from { opacity: 0; transform: translateY(-6px); } }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>Praesens <span>Guest Enrollment</span></h1>
    <button type="button" id="login-toggle-btn" class="small primary">Login</button>
  </div>
  <span id="recog-status" class="pill warn">Checking recognition…</span>
  
  <form id="login-form" class="hidden" style="width: 100%; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
    <div style="display: flex; gap: 8px; align-items: flex-end;">
      <div class="field" style="margin-bottom:0; flex:1;">
        <label for="login-user">Username</label>
        <input id="login-user" type="text" required>
      </div>
      <div class="field" style="margin-bottom:0; flex:1;">
        <label for="login-pass">Password</label>
        <input id="login-pass" type="password" required>
      </div>
      <button type="submit" class="primary" id="login-submit-btn">Sign In</button>
      <button type="button" id="logout-btn" class="danger hidden">Logout</button>
    </div>
    <div id="login-notice" class="notice hidden" style="margin-top: 8px;"></div>
  </form>
</header>

<main>
  <section class="panel">
    <button type="button" class="primary" id="open-btn" style="width:100%">Enroll guest</button>
    <div id="enroll-notice" class="notice hidden"></div>

    <form id="enroll-form" class="hidden" autocomplete="off">
      <div class="panel-head">
        <h2>New enrollment</h2>
        <button type="button" class="small danger" id="close-btn">Cancel</button>
      </div>
      <div class="row">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" type="text" maxlength="30" required>
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" type="text" maxlength="30" required>
        </div>
      </div>
      <div class="field">
        <label for="bio">Notes for staff</label>
        <textarea id="bio" placeholder="Room, preferences, VIP status…"></textarea>
      </div>

      <div class="field">
        <label>Photo</label>
        <div class="photo-box" id="photo-box">
          <span id="photo-placeholder">No photo yet</span>
          <img id="live" class="hidden" alt="Live camera view">
          <img id="preview" class="hidden" alt="Guest photo preview">
        </div>
        <div class="photo-actions">
          <button type="button" id="capture-btn" disabled>Capture</button>
        </div>
      </div>

      <button type="submit" class="primary" id="submit-btn" style="width:100%">Enroll</button>
      <div id="form-notice" class="notice hidden"></div>
    </form>
  </section>

  <section class="panel">
    <div class="list-head">
      <h2>Guests <span id="guest-count" class="id"></span></h2>
      <input type="text" id="search" placeholder="Search by name">
    </div>
    <div id="guests" class="guests"></div>
    <div id="guests-empty" class="empty hidden">No guests enrolled yet.</div>
  </section>
</main>

<div id="popups" class="popups" aria-live="polite"></div>

<script>
const API = "/api/v1/";
const RECOGNITION = `${location.protocol}//${location.host}/faces/`;
const $ = (id) => document.getElementById(id);

let photoBlob = null;   
let live = false;       
let guests = [];        
let enrolled = new Set();
let recognitionOnline = false;
let present = new Set();  

// Token Management
let bearerToken = localStorage.getItem("bearer_token") || "";

function getAuthHeaders(extraHeaders = {}) {
  const headers = { ...extraHeaders };
  if (bearerToken) {
    headers["Authorization"] = `Bearer ${bearerToken}`;
  }
  return headers;
}

// Helper to load authenticated images via fetch and blob URLs
async function loadAuthenticatedImage(imgElement, url) {
  try {
    const res = await fetch(url, { headers: getAuthHeaders() });
    if (!res.ok) throw new Error(`Failed to load image: ${res.status}`);
    const blob = await res.blob();
    if (imgElement.src) URL.revokeObjectURL(imgElement.src);
    imgElement.src = URL.createObjectURL(blob);
  } catch (err) {
    console.error(err);
  }
}

// ---- Login Handling ----

$("login-toggle-btn").onclick = () => {
  const form = $("login-form");
  form.classList.toggle("hidden");
  if (!form.classList.contains("hidden") && bearerToken) {
    $("login-user").value = "••••••";
    $("login-pass").value = "••••••";
    $("login-user").disabled = true;
    $("login-pass").disabled = true;
    hide("login-submit-btn");
    show("logout-btn");
  } else {
    $("login-user").disabled = false;
    $("login-pass").disabled = false;
    show("login-submit-btn");
    hide("logout-btn");
  }
};

$("logout-btn").onclick = () => {
  bearerToken = "";
  localStorage.removeItem("bearer_token");
  $("login-form").reset();
  $("login-user").disabled = false;
  $("login-pass").disabled = false;
  show("login-submit-btn");
  hide("logout-btn");
  notice("Logged out successfully.", "ok", "login-notice");
  $("login-toggle-btn").textContent = "Login";
  listenForGuests();
  refresh();
};

$("login-form").onsubmit = async (e) => {
  e.preventDefault();
  const username = $("login-user").value;
  const password = $("login-pass").value;

  $("login-submit-btn").disabled = true;
  $("login-submit-btn").textContent = "Signing in...";

  try {
    // Explicitly unauthenticated per requirements ("except login")
    const res = await fetch(API + "login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(detailText(data) || `Login failed with status ${res.status}`);
    }
    
    bearerToken = data.token || data.access_token || data.bearer;
    if (!bearerToken) {
      throw new Error("No token returned from server.");
    }

    localStorage.setItem("bearer_token", bearerToken);
    notice("Login successful!", "ok", "login-notice");
    $("login-toggle-btn").textContent = "Logged In";
    setTimeout(() => {
      hide("login-form");
      $("login-notice").classList.add("hidden");
    }, 1500);
    listenForGuests();
    refresh();
  } catch (err) {
    notice("Login error: " + err.message, "bad", "login-notice");
  } finally {
    $("login-submit-btn").disabled = false;
    $("login-submit-btn").textContent = "Sign In";
  }
};

if (bearerToken) {
  $("login-toggle-btn").textContent = "Logged In";
}

// ---- Enrollment panel ----

$("open-btn").onclick = () => {
  hide("open-btn"); hide("enroll-notice"); show("enroll-form");
  clearNotice();
  startCamera();
};

$("close-btn").onclick = () => closePanel();

function closePanel() {
  stopCamera();
  clearPhoto();
  $("enroll-form").reset();
  hide("enroll-form"); show("open-btn");
}

let streamAbortController = null;

// Authenticated camera stream using fetch reader to pass Authorization header
async function startCamera() {
  clearPhoto();
  $("capture-btn").disabled = true;
  $("capture-btn").textContent = "Capture";
  $("photo-placeholder").textContent = "Connecting to camera…";
  
  live = true;
  streamAbortController = new AbortController();

  try {
    const res = await fetch(RECOGNITION + "stream?t=" + Date.now(), {
      headers: getAuthHeaders(),
      signal: streamAbortController.signal
    });
    if (!res.ok) throw new Error(`Stream returned status ${res.status}`);
    
    const reader = res.body.getReader();
    const img = $("live");
    show("live");
    hide("photo-placeholder");
    $("capture-btn").disabled = false;

    // Handle multipart/x-mixed-replace stream manually via chunks/blobs
    const contentType = res.headers.get("content-type") || "";
    // If it's a standard MJPEG stream boundary, parse parts or read chunks
    let boundary = "--frame";
    const match = contentType.match(/boundary=([^;]+)/i);
    if (match) boundary = match[1];

    let buffer = new Uint8Array(0);
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    while (live) {
      const { value, done } = await reader.read();
      if (done) break;
      
      // Accumulate chunks and extract JPEG frames
      let newBuffer = new Uint8Array(buffer.length + value.length);
      newBuffer.set(buffer);
      newBuffer.set(value, buffer.length);
      buffer = newBuffer;

      // Search for JPEG start (FF D8) and end (FF D9) markers in buffer
      let startIdx = -1;
      let endIdx = -1;
      for (let i = 0; i < buffer.length - 1; i++) {
        if (buffer[i] === 0xFF && buffer[i+1] === 0xD8) {
          startIdx = i;
          break;
        }
      }
      if (startIdx !== -1) {
        for (let i = startIdx + 2; i < buffer.length - 1; i++) {
          if (buffer[i] === 0xFF && buffer[i+1] === 0xD9) {
            endIdx = i + 2;
            break;
          }
        }
      }

      if (startIdx !== -1 && endIdx !== -1) {
        const frameData = buffer.slice(startIdx, endIdx);
        buffer = buffer.slice(endIdx); // remainder

        const blob = new Blob([frameData], { type: "image/jpeg" });
        if (img.src) URL.revokeObjectURL(img.src);
        img.src = URL.createObjectURL(blob);
      }
    }
  } catch (err) {
    if (err.name !== "AbortError") {
      stopCamera();
      $("photo-placeholder").textContent = "The camera isn't available or unauthorized.";
      $("capture-btn").textContent = "Try again";
      $("capture-btn").disabled = false;
    }
  }
}

function stopCamera() {
  live = false;
  if (streamAbortController) {
    streamAbortController.abort();
    streamAbortController = null;
  }
  $("live").removeAttribute("src");
  hide("live");
}

$("capture-btn").onclick = async () => {
  if (!live) { startCamera(); return; }
  $("capture-btn").disabled = true;
  try {
    const res = await fetch(RECOGNITION + "camera/snapshot", { 
      cache: "no-store",
      headers: getAuthHeaders()
    });
    if (!res.ok) throw new Error(`camera returned ${res.status}`);
    const blob = await res.blob();
    stopCamera();
    setPhoto(blob);
    $("capture-btn").textContent = "Retake";
  } catch (err) {
    notice("Couldn't take the photo: " + err.message, "bad");
  } finally {
    $("capture-btn").disabled = false;
  }
};

function setPhoto(blob) {
  photoBlob = blob;
  const img = $("preview");
  if (img.src) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(blob);
  show("preview"); hide("photo-placeholder");
  clearNotice();
}

function clearPhoto() {
  photoBlob = null;
  hide("preview"); show("photo-placeholder");
}

// ---- Enroll ----

$("enroll-form").onsubmit = async (e) => {
  e.preventDefault();
  if (!photoBlob) { notice("Capture a photo first.", "warn"); return; }

  const form = new FormData();
  form.append("first_name", $("first-name").value.trim());
  form.append("last_name", $("last-name").value.trim());
  form.append("bio", $("bio").value.trim());
  form.append("file", photoBlob, "photo.jpg");

  $("submit-btn").disabled = true;
  $("submit-btn").textContent = "Enrolling…";
  try {
    const res = await fetch(API + "enroll", {
      method: "POST", 
      headers: getAuthHeaders(),
      body: form 
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 422) {
      notice(`Photo not accepted (${detailText(body).replace(/\.$/, "")}). Please retake it.`, "bad");
      return;
    }
    if (!res.ok) {
      notice("Enrollment failed: " + detailText(body), "bad");
      return;
    }
    const name = `${body.first_name} ${body.last_name}`;
    closePanel();
    if (body.recognition?.status === "enrolled") {
      notice(`${name} is enrolled and will be recognized now.`, "ok", "enroll-notice");
    } else {
      notice(`${name} is saved. ${body.recognition?.detail ?? ""}`, "warn", "enroll-notice");
    }
    await refresh();
  } catch (err) {
    notice("Couldn't reach the server: " + err.message, "bad");
  } finally {
    $("submit-btn").disabled = false;
    $("submit-btn").textContent = "Enroll";
  }
};

function detailText(body) {
  const d = body?.detail;
  if (!d) return "unknown error.";
  if (typeof d === "string") return d;
  return d.map((x) => x.msg).join("; ");
}

// ---- Guest list ----

async function refresh() {
  const [usersRes, recogRes] = await Promise.all([
    fetch(API + "users/", { headers: getAuthHeaders() }),
    fetch(API + "recognition", { headers: getAuthHeaders() }),
  ]);
  const users = await usersRes.json();
  const recog = await recogRes.json();

  guests = Object.entries(users)
    .map(([id, u]) => ({ id: Number(id), ...u }))
    .sort((a, b) => b.id - a.id);
  enrolled = new Set(recog.enrolled);
  recognitionOnline = recog.online;

  const pill = $("recog-status");
  if (recognitionOnline) {
    pill.className = "pill ok";
    pill.textContent = `Recognition online · ${enrolled.size} loaded`;
  } else {
    pill.className = "pill bad";
    pill.textContent = "Recognition offline";
  }
  render();
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const shown = guests.filter((g) =>
    `${g.first_name} ${g.last_name}`.toLowerCase().includes(q));

  $("guest-count").textContent = guests.length ? `(${guests.length})` : "";
  $("guests-empty").classList.toggle("hidden", guests.length > 0);

  const list = $("guests");
  list.replaceChildren(...shown.map(guestCard));
}

function guestCard(g) {
  const card = el("div", "guest");

  const who = el("div", "who");
  const name = el("div", "name", `${g.first_name} ${g.last_name} `);
  name.append(el("span", "id", `#${g.id}`));
  who.append(name);
  if (g.bio) {
    const bio = el("div", "bio", g.bio);
    bio.title = g.bio;
    who.append(bio);
  }
  card.append(who);

  const status = el("div", "status");
  if (!recognitionOnline) {
    status.append(el("span", "pill warn", "Waiting"));
  } else if (enrolled.has(g.id)) {
    const tag = el("span", presenceClass(g.id), "Recognized");
    tag.dataset.presence = g.id;
    status.append(tag);
  } else {
    const retry = el("button", "small", "Retry");
    retry.type = "button";
    retry.onclick = () => resync(g, retry);
    status.append(el("span", "pill bad", "Not loaded"), retry);
  }
  card.append(status);

  const img = el("img");
  img.alt = `${g.first_name} ${g.last_name}`;
  img.loading = "lazy";
  loadAuthenticatedImage(img, `${API}users/${g.id}/photo`);
  card.append(img);

  const del = el("button", "small danger", "Checkout");
  del.type = "button";
  del.onclick = () => {
    if (del.dataset.armed) { remove(g, del); return; }
    del.dataset.armed = "1";
    del.textContent = "Confirm";
    setTimeout(() => { delete del.dataset.armed; del.textContent = "Checkout"; }, 4000);
  };
  card.append(del);
  return card;
}

async function remove(g, btn) {
  btn.disabled = true;
  const res = await fetch(`${API}users/${g.id}`, { 
    method: "DELETE",
    headers: getAuthHeaders()
  });
  if (!res.ok) {
    btn.disabled = false;
    notice(`Couldn't check out ${g.first_name}: ${detailText(await res.json().catch(() => ({})))}`, "bad", "enroll-notice");
    return;
  }
  await refresh();
}

async function resync(g, btn) {
  btn.disabled = true;
  btn.textContent = "Trying…";
  const res = await fetch(`${API}users/${g.id}/sync`, { 
    method: "POST",
    headers: getAuthHeaders()
  });
  const body = await res.json().catch(() => ({}));
  if (body.status !== "enrolled") {
    notice(`${g.first_name} ${g.last_name}: ${body.detail ?? detailText(body)}`, "bad", "enroll-notice");
  }
  await refresh();
}

$("search").oninput = render;

// ---- Helpers ----

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function show(id) { $(id).classList.remove("hidden"); }
function hide(id) { $(id).classList.add("hidden"); }

function notice(text, kind, target = "form-notice") {
  const n = $(target);
  n.textContent = text;
  n.className = `notice ${kind}`;
}
function clearNotice() { $("form-notice").className = "notice hidden"; }

// ---- Guest popups & Authenticated WebSockets ----

let ws = null;
const MAX_POPUPS = 4;

function listenForGuests() {
  if (ws) {
    ws.close();
  }
  const wsUrl = RECOGNITION.replace(/^http/, "ws") + "events";
  
  // Standard WebSockets in browsers don't support custom headers. 
  // We pass the token via subprotocols array (e.g. ["bearer", token]) or fallback if accepted by server.
  const protocols = bearerToken ? ["bearer", bearerToken] : undefined;
  
  try {
    ws = new WebSocket(wsUrl, protocols);
  } catch (err) {
    ws = new WebSocket(wsUrl);
  }

  ws.onmessage = (e) => {
    const event = JSON.parse(e.data);
    if (event.type === "guest_detected") showPopup(event);
    if (event.type === "presence") setPresent(event.guest_ids.map(Number));
  };
  ws.onclose = () => {
    setPresent([]);
    setTimeout(listenForGuests, 3000);
  };
}

function setPresent(ids) {
  present = new Set(ids);
  for (const tag of document.querySelectorAll("[data-presence]")) {
    tag.className = presenceClass(Number(tag.dataset.presence));
  }
}

function presenceClass(id) {
  return present.has(id) ? "pill ok" : "pill idle";
}

async function showPopup(event) {
  const res = await fetch(`${API}users/${event.guest_id}`, { headers: getAuthHeaders() });
  if (!res.ok) return;  
  const g = await res.json();

  const card = el("div", event.status === "review" ? "popup review" : "popup");
  const img = el("img");
  img.alt = `${g.first_name} ${g.last_name}`;
  loadAuthenticatedImage(img, `${API}users/${g.id}/photo`);
  card.append(img);

  const info = el("div", "info");
  const title = el("div", "title");
  title.append(el("div", "name", `${g.first_name} ${g.last_name}`));
  const close = el("button", "close", "×");
  close.type = "button";
  close.title = "Dismiss";
  close.onclick = () => card.remove();
  title.append(close);
  info.append(title);

  const time = new Date(event.timestamp * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const meta = event.status === "review" ? `Possible match · ${time}` : `Arrived · ${time}`;
  info.append(el("div", "meta", meta));
  if (g.bio) info.append(el("div", "bio", g.bio));
  card.append(info);

  const stack = $("popups");
  stack.prepend(card);
  while (stack.children.length > MAX_POPUPS) stack.lastElementChild.remove();
}

listenForGuests();
refresh().catch((e) => notice("Couldn't load guests: " + e.message, "bad", "enroll-notice"));
setInterval(() => refresh().catch(() => {}), 15000);
</script>
</body>
