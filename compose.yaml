x-common-env: &common-env
  INTERNAL_ADMIN_UN: praesens
  INTERNAL_ADMIN_PW: changeme

services:
  praesens_db:
    container_name: praesens_db
    image: postgres:18
    tty: true
    restart: unless-stopped
    # Uncomment these to publish the database ports. Not recommended for
    # deployment, but necessary if the DB API is being run outside of the
    # container and needs to be accessed from the host.
    # ports:
    #   - 5432:5432
    volumes:
      - praesens_db_data:/var/lib/postgresql
    networks:
      - praesens_net
    environment:
      POSTGRES_USER: praesens
      POSTGRES_PASSWORD: praesens

  praesens_db_api:
    container_name: praesens_db_api
    tty: true
    build:
      context: ./database_api/
      dockerfile: Dockerfile
    image: praesens_db_api:latest
    restart: unless-stopped
    networks:
      - praesens_net
    ports:
      - "8000:8000"
    volumes:
      - ./images:/database_api/images:rw,z,U
    depends_on:
      - praesens_db
    environment:
        DB_HOST: praesens_db
        <<: *common-env

  praesens_recognition:
    container_name: praesens_recognition
    tty: true
    build:
      context: ./recognition/
      dockerfile: Dockerfile
    image: praesens_recognition:latest
    restart: unless-stopped
    # This method of passing the webcam into the container doesn't work on 
    # macOS or Windows (even under WSL). The recognition server just has to be
    # run baremetal as it was before the Docker implementation.
    # You should be able to run `docker-compose up -d praesens_db praesens_db_api praesens_proxy`
    # to only start the appropriate containers. There are fallbacks in Caddy 
    # to access servers running on the host if the container is not found.
    devices:
      - /dev/video0:/dev/video0:rwm
    privileged: true
    group_add:
      - "video"
    networks:
      - praesens_net
    ports:
      - "8001:8001"
    volumes:
      - ./images:/recognition/images:ro,z
    environment:
      PRAESENS_API_URL: http://praesens_db_api:8000/api/v1
      <<: *common-env
    depends_on:
      - praesens_db_api

  praesens_proxy:
    container_name: praesens_proxy
    tty: true
    image: caddy:2.11
    restart: unless-stopped
    networks:
      - praesens_net
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:Z
      - ./praesens_dashboard/:/var/www/html:Z
      - praesens_proxy_data:/data
      - praesens_proxy_config:/config
    environment:
      HOST_HOSTNAME: ${HOSTNAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  praesens_db_data:
  praesens_proxy_data:
  praesens_proxy_config:

networks:
  praesens_net:
    driver: bridge
